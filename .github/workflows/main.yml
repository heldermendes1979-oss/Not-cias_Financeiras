

name: Bot Financeiro Diário

on:
  schedule:
    # Roda de segunda a sexta, às 11:00 UTC (08:00 no horário de Brasília)
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Permite rodar manualmente clicando em um botão no GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Configurar o Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar bibliotecas
        run: pip install requests feedparser google-generativeai

      - name: Rodar o script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python Noticias.py
